name: Publish documentation

on:
  push:
    paths:
      - 'docs/**'
      - 'zensical.toml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Build site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = Path("zensical.toml")
          source = config.read_text(encoding="utf-8")
          site_url = os.environ["PAGES_URL"].rstrip("/") + "/"
          if not site_url.startswith(("http://", "https://")):
              raise SystemExit("GitHub Pages did not provide a site URL.")
          config.write_text(
              source.replace("[project]\n", f"[project]\nsite_url = {json.dumps(site_url)}\n", 1),
              encoding="utf-8",
          )
          PY
          zensical build --clean
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
